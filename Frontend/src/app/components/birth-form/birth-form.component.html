<div class="birth-form-container">
  <div class="form-card">
    <div class="form-header">
      <div class="header-icon">🕉️</div>
      <h2>LẬP LÁ SỐ TỬ VI</h2>
      <p class="subtitle">Nhập chính xác thông tin để có kết quả luận giải tốt nhất</p>
    </div>

    <form (ngSubmit)="onSubmit()" #birthForm="ngForm" class="modern-form">
      
      <!-- Section: Personal Info -->
      <div class="form-section personal-section">
        <div class="input-group full-width">
          <label for="fullName">Họ và tên</label>
          <div class="input-wrapper">
            <span class="input-icon">👤</span>
            <input 
              type="text" 
              id="fullName" 
              name="fullName" 
              [(ngModel)]="fullName" 
              placeholder="VD: Nguyễn Văn A"
              [class.error]="errors['fullName']">
          </div>
          <span class="error-msg" *ngIf="errors['fullName']">{{ errors['fullName'] }}</span>
        </div>

        <div class="input-group full-width">
          <label>Giới tính</label>
          <div class="gender-selector">
            <label class="gender-option" [class.selected]="birthInfo.isMale">
              <input type="radio" name="gender" [value]="true" [(ngModel)]="birthInfo.isMale">
              <span class="gender-icon">👨</span>
              <span class="gender-text">Nam</span>
            </label>
            <label class="gender-option" [class.selected]="!birthInfo.isMale">
              <input type="radio" name="gender" [value]="false" [(ngModel)]="birthInfo.isMale">
              <span class="gender-icon">👩</span>
              <span class="gender-text">Nữ</span>
            </label>
          </div>
        </div>
      </div>

      <!-- Section: Date & Time -->
      <div class="form-section datetime-section">
        <div class="section-title">Thời điểm sinh</div>
        
        <!-- Calendar Type Tabs -->
        <div class="calendar-switch">
          <button 
            type="button" 
            class="switch-btn" 
            [class.active]="calendarType === 'lunar'"
            (click)="switchCalendarType('lunar')">
            🌙 Âm lịch
          </button>
          <button 
            type="button" 
            class="switch-btn" 
            [class.active]="calendarType === 'solar'"
            (click)="switchCalendarType('solar')">
            ☀️ Dương lịch
          </button>
        </div>

        <!-- Lunar Date Inputs -->
        <div class="date-row" *ngIf="calendarType === 'lunar'">
          <div class="input-group">
            <label for="day">Ngày</label>
            <select id="day" name="day" [(ngModel)]="birthInfo.day" (change)="resetLunarTracking()" [class.error]="errors['day']">
              <option *ngFor="let d of days" [value]="d">{{ d }}</option>
            </select>
          </div>
          <div class="input-group">
            <label for="month">Tháng</label>
            <select id="month" name="month" [(ngModel)]="birthInfo.month" (change)="onMonthChange()" [class.error]="errors['month']">
              <option *ngFor="let m of months" [value]="m">{{ m }}</option>
            </select>
          </div>
          <div class="input-group">
            <label for="year">Năm</label>
            <select id="year" name="year" [(ngModel)]="birthInfo.year" (change)="updateDaysInMonth()" [class.error]="errors['year']">
              <option *ngFor="let y of years" [value]="y">{{ y }}</option>
            </select>
          </div>
        </div>

        <!-- Solar Date Inputs -->
        <div class="date-row" *ngIf="calendarType === 'solar'">
          <div class="input-group">
            <label for="solarDay">Ngày</label>
            <select id="solarDay" name="solarDay" [(ngModel)]="solarDate.day" (change)="onSolarDateChange()" [class.error]="errors['day']">
              <option *ngFor="let d of solarDays" [value]="d">{{ d }}</option>
            </select>
          </div>
          <div class="input-group">
            <label for="solarMonth">Tháng</label>
            <select id="solarMonth" name="solarMonth" [(ngModel)]="solarDate.month" (change)="onSolarDateChange()" [class.error]="errors['month']">
              <option *ngFor="let m of months" [value]="m">{{ m }}</option>
            </select>
          </div>
          <div class="input-group">
            <label for="solarYear">Năm</label>
            <select id="solarYear" name="solarYear" [(ngModel)]="solarDate.year" (change)="onSolarDateChange()" [class.error]="errors['year']">
              <option *ngFor="let y of years" [value]="y">{{ y }}</option>
            </select>
          </div>
        </div>
        
        <div class="conversion-alert" *ngIf="calendarType === 'solar' && lunarConversionText">
          <span class="icon">ℹ️</span> {{ lunarConversionText }}
        </div>

        <!-- Time Input -->
        <div class="input-group full-width">
          <label for="birthTime">Giờ sinh (chính xác)</label>
          <div class="time-input-group">
            <div class="time-input">
              <input 
                type="number" 
                id="birthHour" 
                name="birthHour" 
                [(ngModel)]="birthInfo.hour"
                (change)="onTimeChange()"
                min="0" 
                max="23"
                placeholder="HH"
                class="hour-input"
                [class.error]="errors['hour']">
              <span class="time-separator">:</span>
              <input 
                type="number" 
                id="birthMinute" 
                name="birthMinute" 
                [(ngModel)]="birthInfo.minute"
                (change)="onTimeChange()"
                min="0" 
                max="59"
                placeholder="MM"
                class="minute-input"
                [class.error]="errors['minute']">
            </div>
            <div class="hour-branch-display" *ngIf="displayHourBranchName">
              <span class="label">Địa chi:</span>
              <span class="value">{{ displayHourBranchName }}</span>
            </div>
          </div>
          <span class="error-msg" *ngIf="errors['hour']">{{ errors['hour'] }}</span>
        </div>
      </div>

      <!-- Section: View Year & Actions -->
      <div class="form-section footer-section">
        <div class="input-group full-width">
          <label for="viewYear">Năm xem hạn</label>
          <select id="viewYear" name="viewYear" [(ngModel)]="viewYear">
            <option *ngFor="let y of years" [value]="y">{{ y }}</option>
          </select>
        </div>

        <div class="actions">
          <button type="submit" class="submit-btn" [disabled]="!birthForm.form.valid">
            <span class="icon">✨</span> Lập Lá Số
          </button>
        </div>
      </div>

    </form>
  </div>
</div>
